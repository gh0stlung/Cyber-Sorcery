<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>NEURAL_INTERFACE // ANDROID_CORE</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <!-- LIBS -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #000000;
            --accent-cyan: #00f3ff;
            --accent-amber: #ffaa00;
            --accent-danger: #ff2a2a;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* HARDWARE ACCELERATED LAYER */
        #output_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; 
            transform: scaleX(-1) translateZ(0); /* Mirror + GPU Hint */
            will-change: transform;
        }

        #input_video { 
            position: absolute; top: 0; left: 0; 
            width: 1px; height: 1px; opacity: 0; pointer-events: none;
        }

        /* UI LAYER */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
        }

        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px; height: 40px; 
            border: 2px solid #333; border-top: 2px solid var(--accent-cyan);
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        #status-text {
            color: var(--accent-cyan); font-size: 14px; letter-spacing: 2px;
            text-align: center; font-family: 'JetBrains Mono', monospace;
        }

        #debug-info {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            color: rgba(255,255,255,0.6);
            text-shadow: 0 1px 2px #000;
        }

        .pill {
            background: rgba(0, 20, 20, 0.85);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 4px 10px; border-radius: 4px;
            display: inline-block; margin-bottom: 4px;
        }

        #retry-btn {
            margin-top: 20px; padding: 10px 20px;
            background: var(--accent-danger); color: #fff;
            border: none; border-radius: 4px; font-weight: bold;
            display: none; pointer-events: auto; cursor: pointer;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div id="debug-info">
            <div id="sys-status" class="pill">BOOTING...</div>
            <div id="fps-counter">FPS: 0</div>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="status-text">INITIALIZING CORE...</div>
        <button id="retry-btn" onclick="location.reload()">RELOAD SYSTEM</button>
    </div>

    <script>
        /**
         * ------------------------------------------------------------------------
         * 1. SYSTEM CORE & STATE MANAGEMENT
         * ------------------------------------------------------------------------
         */
        const CONFIG = {
            colors: {
                primary: '#00f3ff', secondary: '#00ff9d',
                lock: '#ffaa00', danger: '#ff2a2a'
            },
            physics: {
                lerp: 0.25, // Adjusted for mobile responsiveness
                decay: 0.15
            },
            limits: {
                maxFPS: 30, // Limit AI inference FPS
                handTimeout: 500 // ms before hand is considered lost
            }
        };

        // Monolithic State Object (GC Friendly)
        const STATE = {
            width: 0, height: 0, dpr: 1,
            isReady: false, isVisible: true,
            lastFrameTime: 0, lastPipeTime: 0,
            pipeBusy: false,
            ctx: null,
            hands: [],
            watchdogTimer: null
        };

        const DOM = {
            video: document.getElementById('input_video'),
            canvas: document.getElementById('output_canvas'),
            loader: document.getElementById('loading-screen'),
            statusText: document.getElementById('status-text'),
            sysStatus: document.getElementById('sys-status'),
            fps: document.getElementById('fps-counter'),
            retryBtn: document.getElementById('retry-btn')
        };

        // Error Recovery
        function fatalError(msg) {
            console.error(msg);
            DOM.statusText.innerText = msg;
            DOM.statusText.style.color = CONFIG.colors.danger;
            document.querySelector('.spinner').style.display = 'none';
            DOM.retryBtn.style.display = 'block';
        }

        // Watchdog: Detects if MediaPipe stalls
        function petWatchdog() {
            if (STATE.watchdogTimer) clearTimeout(STATE.watchdogTimer);
            STATE.watchdogTimer = setTimeout(() => {
                if(STATE.isReady && STATE.isVisible) {
                    console.warn("Watchdog barked: Pipeline stalled");
                    STATE.pipeBusy = false; // Force unlock
                }
            }, 3000);
        }

        /**
         * ------------------------------------------------------------------------
         * 2. PHYSICS & MATH ENGINE
         * ------------------------------------------------------------------------
         */
        const MATH = {
            lerp: (s, e, t) => {
                const v = (1 - t) * s + t * e;
                return Math.abs(e - v) < 0.01 ? e : v;
            },
            clamp: (v, min, max) => Math.min(Math.max(v, min), max),
            map: (v, s1, st1, s2, st2) => s2 + (st2 - s2) * ((v - s1) / (st1 - s1))
        };

        class HandEntity {
            constructor() {
                this.active = false;
                this.opacity = 0;
                this.x = 0; this.y = 0;
                this.size = 0; this.rot = 0;
                this.pinch = 0;
                this.fingers = Array(5).fill().map(() => ({x:0, y:0}));
                this.lastUpdate = 0;
                this.mode = 'IDLE';
            }

            update(lm, now) {
                this.active = true;
                this.lastUpdate = now;
                this.opacity = 1;

                // Canvas Dimensions (CSS Pixels)
                const w = STATE.width / STATE.dpr;
                const h = STATE.height / STATE.dpr;

                // 1. Raw Targets
                const wrist = lm[0];
                const mid = lm[9];
                
                const tx = (wrist.x + mid.x) * 0.5 * w;
                const ty = (wrist.y + mid.y) * 0.5 * h;
                
                const dx = mid.x - wrist.x;
                const dy = mid.y - wrist.y;
                const trot = Math.atan2(dy, dx);
                const tsize = Math.sqrt(dx*dx + dy*dy) * w * 2.2;

                const pinchDist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
                const tpinch = MATH.map(pinchDist, 0.02, 0.15, 1, 0);

                // 2. Physics Interpolation
                const f = CONFIG.physics.lerp;
                
                // Snap if far away (Prevent trails on entry)
                if (Math.hypot(tx - this.x, ty - this.y) > 300) {
                    this.x = tx; this.y = ty; this.rot = trot; this.size = tsize;
                } else {
                    this.x = MATH.lerp(this.x, tx, f);
                    this.y = MATH.lerp(this.y, ty, f);
                    
                    let dRot = trot - this.rot;
                    while (dRot < -Math.PI) dRot += Math.PI*2;
                    while (dRot > Math.PI) dRot -= Math.PI*2;
                    this.rot += dRot * f;

                    this.size = MATH.lerp(this.size, tsize, f);
                    this.pinch = MATH.lerp(this.pinch, MATH.clamp(tpinch, 0, 1), 0.2);
                }

                // Fingers
                [4,8,12,16,20].forEach((idx, i) => {
                    const fx = lm[idx].x * w;
                    const fy = lm[idx].y * h;
                    this.fingers[i].x = MATH.lerp(this.fingers[i].x, fx, f);
                    this.fingers[i].y = MATH.lerp(this.fingers[i].y, fy, f);
                });

                this.mode = this.pinch > 0.8 ? 'LINK' : 'IDLE';
            }

            decay(now) {
                // Time-based decay to prevent sticking
                if (now - this.lastUpdate > CONFIG.limits.handTimeout) {
                    this.opacity -= CONFIG.physics.decay;
                    if (this.opacity <= 0) {
                        this.active = false;
                        this.opacity = 0;
                    }
                }
            }
        }

        STATE.hands = [new HandEntity(), new HandEntity()];

        /**
         * ------------------------------------------------------------------------
         * 3. RENDER ENGINE (Canvas 2D Optimized)
         * ------------------------------------------------------------------------
         */
        function setupCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap DPI for perf
            STATE.dpr = dpr;
            
            // Internal Resolution
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Prevent accumulation of transforms
            if (STATE.ctx) STATE.ctx.setTransform(1, 0, 0, 1, 0, 0);

            DOM.canvas.width = w * dpr;
            DOM.canvas.height = h * dpr;
            
            STATE.width = DOM.canvas.width;
            STATE.height = DOM.canvas.height;

            STATE.ctx = DOM.canvas.getContext('2d', {
                alpha: false,
                desynchronized: true // Android optimization
            });

            // Apply global scale ONCE
            STATE.ctx.scale(dpr, dpr);
        }

        function drawRing(ctx, x, y, r, color, width, dash) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
            ctx.ellipse(x, y, r, r * 0.85, 0, 0, Math.PI*2);
            ctx.stroke();
        }

        function render() {
            if (!STATE.isVisible) return;

            const ctx = STATE.ctx;
            const w = STATE.width / STATE.dpr;
            const h = STATE.height / STATE.dpr;
            const now = performance.now();
            const time = now * 0.001;

            // 1. Clear with Source Over (Reset state)
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#020202';
            ctx.fillRect(0, 0, w, h);

            // 2. Draw Video Background (Dimmed)
            if (DOM.video.readyState >= 2) {
                ctx.globalAlpha = 0.4;
                const vw = DOM.video.videoWidth;
                const vh = DOM.video.videoHeight;
                // Object-fit: cover logic
                const scale = Math.max(w / vw, h / vh);
                const dw = vw * scale;
                const dh = vh * scale;
                const dx = (w - dw) / 2;
                const dy = (h - dh) / 2;
                ctx.drawImage(DOM.video, dx, dy, dw, dh);
                ctx.globalAlpha = 1.0;
            }

            // 3. Draw Visuals
            ctx.globalCompositeOperation = 'lighter';

            STATE.hands.forEach(hand => {
                hand.decay(now);
                if (hand.opacity <= 0.01) return;

                ctx.globalAlpha = hand.opacity;
                const color = hand.mode === 'LINK' ? CONFIG.colors.lock : CONFIG.colors.primary;

                // -- MATRIX RING --
                ctx.save();
                ctx.translate(hand.x, hand.y);
                ctx.rotate(hand.rot - Math.PI/2);

                // Static Base
                drawRing(ctx, 0, 0, hand.size, color, 2, []);
                
                // Gyro Spinner
                ctx.rotate(time);
                drawRing(ctx, 0, 0, hand.size * 1.3, `rgba(255,255,255,0.2)`, 1, [5, 10]);
                
                // Tech Segments
                ctx.rotate(-time * 2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.setLineDash([]);
                ctx.beginPath();
                for(let i=0; i<3; i++) {
                    ctx.rotate((Math.PI*2)/3);
                    ctx.moveTo(hand.size*0.9, 0);
                    ctx.arc(0, 0, hand.size*0.9, 0, 0.6);
                }
                ctx.stroke();
                ctx.restore();

                // -- FINGERS --
                hand.fingers.forEach((f, i) => {
                    ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(hand.x, hand.y);
                    ctx.lineTo(f.x, f.y);
                    ctx.stroke();

                    ctx.fillStyle = i === 1 ? CONFIG.colors.secondary : color;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 4, 0, Math.PI*2);
                    ctx.fill();
                });

                // -- PINCH BEAM --
                if (hand.pinch > 0.5) {
                    const t = hand.fingers[0];
                    const i = hand.fingers[1];
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2 + (hand.pinch * 4);
                    ctx.beginPath();
                    ctx.moveTo(t.x, t.y);
                    ctx.lineTo(i.x, i.y);
                    ctx.stroke();
                    
                    const cx = (t.x + i.x)/2;
                    const cy = (t.y + i.y)/2;
                    ctx.fillStyle = CONFIG.colors.lock;
                    ctx.shadowColor = CONFIG.colors.lock;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 6 + Math.random()*4, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // FPS Stats
            if (STATE.frame % 30 === 0) {
                const fps = Math.round(1000 / (now - STATE.lastFrameTime) * 30);
                DOM.fps.innerText = `FPS: ${fps}`;
                STATE.lastFrameTime = now;
            }
            STATE.frame++;

            requestAnimationFrame(render);
        }

        /**
         * ------------------------------------------------------------------------
         * 4. APP LIFECYCLE
         * ------------------------------------------------------------------------
         */
        async function init() {
            try {
                setupCanvas();
                window.addEventListener('resize', () => {
                    setupCanvas();
                });

                // 1. Camera Init
                DOM.statusText.innerText = "ACCESSING CAMERA...";
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                DOM.video.srcObject = stream;
                await new Promise(r => DOM.video.onloadedmetadata = r);
                await DOM.video.play();

                // 2. MediaPipe Init
                DOM.statusText.innerText = "LOADING NEURAL NET...";
                const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                
                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 0, // Lite for Android
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(onResults);

                // 3. Start Loop
                DOM.loader.style.opacity = '0';
                setTimeout(() => DOM.loader.style.display = 'none', 500);
                DOM.sysStatus.innerText = "ONLINE";
                DOM.sysStatus.style.borderColor = CONFIG.colors.secondary;
                DOM.sysStatus.style.color = CONFIG.colors.secondary;
                STATE.isReady = true;

                // 4. Decoupled AI Loop
                render();
                processAI(hands);

            } catch (e) {
                fatalError("INIT FAILED: " + e.message);
            }
        }

        function onResults(results) {
            STATE.pipeBusy = false;
            petWatchdog(); // Reset watchdog
            
            const now = performance.now();
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((lm, i) => {
                    if (i < 2) STATE.hands[i].update(lm, now);
                });
            }
        }

        async function processAI(hands) {
            if (!STATE.isVisible) {
                setTimeout(() => processAI(hands), 500); // Sleep if hidden
                return;
            }

            const now = performance.now();
            const elapsed = now - STATE.lastPipeTime;
            const limit = 1000 / CONFIG.limits.maxFPS;

            if (elapsed > limit && !STATE.pipeBusy) {
                STATE.pipeBusy = true;
                STATE.lastPipeTime = now;
                try {
                    await hands.send({image: DOM.video});
                } catch(e) {
                    console.warn("Pipe dropped frame");
                    STATE.pipeBusy = false;
                }
            }
            
            requestAnimationFrame(() => processAI(hands));
        }

        // Visibility Handling (Android Backgrounding)
        document.addEventListener('visibilitychange', () => {
            STATE.isVisible = !document.hidden;
            if (STATE.isVisible) {
                console.log("Resuming...");
                DOM.video.play().catch(console.error);
                STATE.lastPipeTime = performance.now(); // Reset timers
            } else {
                console.log("Pausing...");
                DOM.video.pause();
            }
        });

        // Start
        window.onload = init;

    </script>
</body>
</html>
