<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER_PROTOCOL // v4.0</title>
    
    <!-- Using low-latency Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <!-- MediaPipe Solutions -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --term-green: #0f0;
            --term-bg: #000500;
            --alert: #ff0055;
            --ui-font: 'VT323', monospace;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--term-bg);
            overflow: hidden;
            font-family: var(--ui-font);
        }

        #input_video { display: none; }

        /* Canvas scales to fit screen, but renders at low res for speed/retro look */
        #output_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            image-rendering: pixelated; /* Sharp pixels for hacker vibe */
            transform: scaleX(-1); /* Mirror */
        }

        /* UI OVERLAY (Not Mirrored) */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 10;
        }

        .hud-header {
            display: flex; justify-content: space-between;
            color: var(--term-green);
            font-size: 24px;
            text-shadow: 0 0 5px var(--term-green);
            text-transform: uppercase;
        }

        .hud-log {
            font-size: 18px;
            color: rgba(0, 255, 0, 0.7);
            background: rgba(0, 10, 0, 0.8);
            padding: 10px;
            border-left: 2px solid var(--term-green);
            width: 300px;
            max-width: 80%;
            min-height: 100px;
        }

        .log-entry { margin-bottom: 2px; }
        .log-entry.warn { color: var(--alert); }

        /* CRT Scanline Effect */
        body::before {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div class="hud-header">
            <div>NETRUNNER.EXE <span style="font-size:14px; opacity:0.7;">v4.0.1</span></div>
            <div id="fps-counter">FPS: 60</div>
        </div>
        <div class="hud-log" id="console-log">
            <div class="log-entry">> SYSTEM BOOT...</div>
            <div class="log-entry">> WAITING FOR HANDSHAKE...</div>
        </div>
    </div>

    <script>
        const VIDEO_ELEMENT = document.getElementById('input_video');
        const CANVAS_ELEMENT = document.getElementById('output_canvas');
        const CTX = CANVAS_ELEMENT.getContext('2d', { alpha: false }); // Fast rendering
        const CONSOLE = document.getElementById('console-log');
        const FPS_DIV = document.getElementById('fps-counter');

        // --- PERFORMANCE CONFIG ---
        // We render at low resolution for performance and style
        const INTERNAL_WIDTH = 640; 
        const INTERNAL_HEIGHT = 360; 
        
        CANVAS_ELEMENT.width = INTERNAL_WIDTH;
        CANVAS_ELEMENT.height = INTERNAL_HEIGHT;

        const CONFIG = {
            colors: {
                primary: '#00ffcc', // Cyan
                fist: '#ff0033',    // Red
                bg: '#000500'
            },
            maxParticles: 60 // Hard limit to prevent lag
        };

        const STATE = {
            particles: [],
            frame: 0,
            logQueue: [],
            fpsLastTime: 0
        };

        // --- LOGGING ---
        function log(msg, type='') {
            if (STATE.logQueue.length > 0 && STATE.logQueue[STATE.logQueue.length-1].text === msg) return; // Debounce
            STATE.logQueue.push({text: msg, type: type});
            if (STATE.logQueue.length > 5) STATE.logQueue.shift();
            
            CONSOLE.innerHTML = STATE.logQueue.map(l => 
                `<div class="log-entry ${l.type}">> ${l.text}</div>`
            ).join('');
        }

        // --- GEOMETRY HELPERS ---
        function drawHex(ctx, x, y, r) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                ctx.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // --- VISUAL EFFECTS ---

        function drawHackerGrid() {
            CTX.strokeStyle = 'rgba(0, 50, 0, 0.3)';
            CTX.lineWidth = 1;
            const step = 40;
            // Moving grid
            const offset = (STATE.frame * 0.5) % step;
            
            CTX.beginPath();
            for(let x = 0; x < INTERNAL_WIDTH; x += step) {
                CTX.moveTo(x, 0); CTX.lineTo(x, INTERNAL_HEIGHT);
            }
            for(let y = offset; y < INTERNAL_HEIGHT; y += step) {
                CTX.moveTo(0, y); CTX.lineTo(INTERNAL_WIDTH, y);
            }
            CTX.stroke();
        }

        function drawCyberMandala(x, y, radius) {
            const t = STATE.frame * 0.05;
            
            // Additive blending makes things glow without shadowBlur
            CTX.globalCompositeOperation = 'lighter'; 
            CTX.lineWidth = 2;

            // Ring 1: Rotating Triangle
            CTX.strokeStyle = CONFIG.colors.primary;
            CTX.save();
            CTX.translate(x, y);
            CTX.rotate(t);
            CTX.beginPath();
            for (let i=0; i<3; i++) {
                const a = (Math.PI*2/3)*i;
                CTX.lineTo(Math.cos(a)*radius, Math.sin(a)*radius);
            }
            CTX.closePath();
            CTX.stroke();
            CTX.restore();

            // Ring 2: Counter-rotating Dashed Circle
            CTX.strokeStyle = '#fff';
            CTX.save();
            CTX.translate(x, y);
            CTX.rotate(-t * 1.5);
            CTX.setLineDash([10, 15]);
            CTX.beginPath();
            CTX.arc(0, 0, radius * 0.8, 0, Math.PI*2);
            CTX.stroke();
            CTX.setLineDash([]);
            CTX.restore();

            // Ring 3: Static Hexagon
            CTX.strokeStyle = 'rgba(0,255,200,0.5)';
            drawHex(CTX, x, y, radius * 1.2);

            CTX.globalCompositeOperation = 'source-over';
        }

        function drawImplosion(x, y, radius) {
            CTX.globalCompositeOperation = 'lighter';
            CTX.strokeStyle = CONFIG.colors.fist;
            CTX.lineWidth = 2;

            // Draw lines sucking in
            const count = 8;
            for(let i=0; i<count; i++) {
                const angle = (Math.PI*2/count) * i + (STATE.frame * 0.1);
                const rOut = radius * 2.5;
                const rIn = radius * 0.5;
                
                CTX.beginPath();
                CTX.moveTo(x + Math.cos(angle)*rOut, y + Math.sin(angle)*rOut);
                CTX.lineTo(x + Math.cos(angle + 0.5)*rIn, y + Math.sin(angle + 0.5)*rIn);
                CTX.stroke();
            }
            
            // Core
            CTX.fillStyle = '#fff';
            CTX.beginPath(); CTX.arc(x, y, radius*0.2, 0, Math.PI*2); CTX.fill();
            
            CTX.globalCompositeOperation = 'source-over';
        }

        function drawTargetRect(x, y, size, color) {
            CTX.strokeStyle = color;
            CTX.lineWidth = 2;
            const s = size * 0.6;
            const g = s * 0.3; // gap
            
            // Corners
            CTX.beginPath();
            CTX.moveTo(x-s, y-s+g); CTX.lineTo(x-s, y-s); CTX.lineTo(x-s+g, y-s);
            CTX.moveTo(x+s-g, y-s); CTX.lineTo(x+s, y-s); CTX.lineTo(x+s, y-s+g);
            CTX.moveTo(x+s, y+s-g); CTX.lineTo(x+s, y+s); CTX.lineTo(x+s-g, y+s);
            CTX.moveTo(x-s+g, y+s); CTX.lineTo(x-s, y+s); CTX.lineTo(x-s, y+s-g);
            CTX.stroke();
            
            // Label
            CTX.fillStyle = color;
            CTX.font = '10px monospace';
            CTX.fillText(`TGT_LOCK: ${Math.floor(x)},${Math.floor(y)}`, x-s, y-s-5);
        }

        // --- MAIN RENDER LOOP ---
        function onResults(results) {
            STATE.frame++;

            // Calculate FPS
            if (STATE.frame % 10 === 0) {
                const now = performance.now();
                const fps = Math.round(1000 / ((now - STATE.fpsLastTime) / 10));
                FPS_DIV.innerText = `FPS: ${fps}`;
                STATE.fpsLastTime = now;
            }

            // 1. Draw Background (Video + Tint)
            CTX.drawImage(results.image, 0, 0, INTERNAL_WIDTH, INTERNAL_HEIGHT);
            CTX.fillStyle = 'rgba(0, 10, 0, 0.6)'; // Heavy matrix tint
            CTX.fillRect(0, 0, INTERNAL_WIDTH, INTERNAL_HEIGHT);
            
            drawHackerGrid();

            // 2. Process Hands
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const handedness = results.multiHandedness[index].label;
                    const wrist = landmarks[0];
                    const mid = landmarks[9];
                    const tips = [8, 12, 16, 20];
                    const mcp = [5, 9, 13, 17];

                    // Project coordinates to internal resolution
                    const cx = mid.x * INTERNAL_WIDTH;
                    const cy = mid.y * INTERNAL_HEIGHT;
                    
                    // Hand Scale
                    const dist = Math.hypot(wrist.x - mid.x, wrist.y - mid.y);
                    const size = Math.min(dist * INTERNAL_WIDTH * 4, 100); // CLAMP SIZE so it's not huge

                    // Detect Open vs Fist
                    let extendedFingers = 0;
                    tips.forEach((t, i) => {
                        const tipY = landmarks[t].y;
                        const mcpY = landmarks[mcp[i]].y;
                        // Simple check: is tip above knuckle? (y is inverted in typical CV, but mp uses 0-1)
                        // Distance check is more reliable
                        const dTip = Math.hypot(landmarks[t].x - wrist.x, landmarks[t].y - wrist.y);
                        const dMcp = Math.hypot(landmarks[mcp[i]].x - wrist.x, landmarks[mcp[i]].y - wrist.y);
                        if (dTip > dMcp * 1.2) extendedFingers++;
                    });

                    if (extendedFingers >= 4) {
                        // STATE: OPEN
                        log(`HAND [${index}]: PROTOCOL_OPEN`, '');
                        drawCyberMandala(cx, cy, size);
                        drawTargetRect(cx, cy, size, CONFIG.colors.primary);
                    } else if (extendedFingers <= 1) {
                        // STATE: FIST
                        log(`HAND [${index}]: CORE_DUMP`, 'warn');
                        drawImplosion(cx, cy, size);
                        drawTargetRect(cx, cy, size, CONFIG.colors.fist);
                    } else {
                        // STATE: IDLE
                        drawTargetRect(cx, cy, size, 'rgba(255,255,255,0.5)');
                    }
                });
            } else {
                if (STATE.frame % 60 === 0) log("SCANNING SECTOR...", "");
            }
        }

        // --- SETUP ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        // CRITICAL PERFORMANCE SETTINGS
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0, // 0 = LITE (Fastest), 1 = FULL
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        // Custom Camera Loop for max control
        const camera = new Camera(VIDEO_ELEMENT, {
            onFrame: async () => {
                await hands.send({image: VIDEO_ELEMENT});
            },
            width: 640,  // Force low res input
            height: 480
        });
        
        camera.start();

        log("SYSTEM INITIALIZED", "");

    </script>
</body>
</html>
